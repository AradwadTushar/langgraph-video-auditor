[project]
name = "video-audit-project"
version = "0.1.0"
description = "Brand Guardian AI - Enterprise Automated Multimodal Video Compliance Auditing Engine"
readme = "README.md"
authors = [
    { name = "AradwadTushar", email = "aradwadtushar2004@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "langgraph>=0.2.0",
    "pypdf>=4.0.0",
    "yt-dlp>=2024.8.6",
    "requests>=2.31.0",
    "azure-identity>=1.15.0",
    "azure-search-documents>=11.4.0",
    "azure-monitor-opentelemetry>=1.6.0"
]

[project.scripts]
video-audit-project = "video_audit_project:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
